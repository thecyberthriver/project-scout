name: TLDP weekly (claims, leaderboard, hackathons, pick-of-week reminder)

on:
  schedule:
    - cron: "0 12 * * 1"   # Monday 8 AM ET: pick-of-the-week reminder to staff (Telegram)
    - cron: "0 20 * * 5"   # Friday 4 PM ET: claims + leaderboard + hackathons in Discord
  workflow_dispatch:
    inputs:
      day:
        description: "friday or monday"
        default: "friday"

permissions:
  contents: read

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python discord_weekly.py ${{ inputs.day && format('--{0}', inputs.day) || '' }}
