name: TLDP weekly (claims, leaderboard, hackathons, pick-of-week reminder)

on:
  schedule:
    - cron: "0 12 * * 1"   # Monday 8 AM ET: pick-of-the-week reminder to staff (Telegram)
    - cron: "0 20 * * 5"   # Friday 4 PM ET: claims + leaderboard + hackathons in Discord
  workflow_dispatch:
    inputs:
      day:
        description: "friday or monday"
        default: "friday"

permissions:
  contents: write   # Monday index rebuild commits index.json

jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python discord_weekly.py ${{ inputs.day && format('--{0}', inputs.day) || '' }}
      - name: Weekly full index rebuild (Mondays)
        if: github.event.schedule == '0 12 * * 1' || inputs.day == 'monday'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SEARCH_BUDGET: "120"
        run: |
          python project_scout.py --index-only
          git config user.name "project-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || (git commit -m "chore: weekly index rebuild [skip ci]" && git pull --rebase && git push)
