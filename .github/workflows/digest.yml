name: Project Scout digest

# Two jobs, deliberately split:
#   screen  — UNTRUSTED work: searches GitHub, shallow-clones third-party repositories and runs Semgrep on them.
#             It has no Discord/Telegram secrets, no git credential (persist-credentials: false) and only
#             contents: read. The only token it sees is the no-permission machine-account search token.
#             Nothing in this job can post to students or write to this repository.
#   publish — TRUSTED work: downloads the screen job's artifact, re-validates every row offline against
#             screening.json + policy, sends the drop, and commits state files.
# Why contents: write still exists (publish job only): the bot commits seen.json (de-dupe state — the Actions
# cache can be evicted and old repos would re-send), published.json (the student-visible set the Cloudflare
# Workers read from raw.githubusercontent), index.json and screening.json. Alternative if you want the
# workflow token read-only everywhere: a deploy key or a GitHub App installation scoped to this repo only,
# with contents: write, used just for the commit step.

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 h (off-the-hour slots run more reliably); sends only when something is new
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: project-scout
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.177.0
      - name: Install extra screening engines (yara, clamav, osv-scanner)
        # Defence in depth on top of Semgrep. A hit from any of these blocks a repo. If an engine can't run
        # (e.g. freshclam is rate-limited), scan.py records it as "not run" rather than silently passing the repo.
        run: |
          pip install yara-python==4.5.4
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam 2>/dev/null || true
          sudo freshclam || echo "freshclam failed; clamav signatures unavailable this run (recorded as not-run)"
          OSV_VERSION=v1.9.2
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" -o osv-scanner
          sudo install -m 0755 osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version
      - run: python -m unittest -v
      - name: Discover and screen (untrusted stage, no secrets)
        env:
          GITHUB_TOKEN: ${{ secrets.GH_SCOUT_TOKEN || github.token }}   # no-permission machine-account token
        run: python project_scout.py --discover --out build/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: screened-drop
          path: build/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: screen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: screened-drop
          path: build/
      - name: Validate against screening results and send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAMPUS_BOT_TOKEN: ${{ secrets.CAMPUS_BOT_TOKEN }}
          CAMPUS_CHAT_ID: ${{ secrets.CAMPUS_CHAT_ID }}
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
        run: python project_scout.py --publish build/
      - name: Commit state
        run: |
          git config user.name "project-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json index.json published.json screening.json
          git diff --cached --quiet || (git commit -m "chore: update seen/index/published/screening state [skip ci]" && git pull --rebase && git push)
      - name: Alert owner on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Project Scout digest FAILED (screening or publishing). Students received nothing from this run. ${RUN_URL}"
