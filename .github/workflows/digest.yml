name: Project Scout digest

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 h (off-the-hour slots run more reliably); sends only when something is new
  workflow_dispatch: {}

permissions:
  contents: write   # seen.json is committed back (Actions cache can be evicted -> old repos would re-send)

concurrency:
  group: project-scout
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: python project_scout.py --self-check
      - name: Search GitHub and send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CAMPUS_BOT_TOKEN: ${{ secrets.CAMPUS_BOT_TOKEN }}
          CAMPUS_CHAT_ID: ${{ secrets.CAMPUS_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
          GITHUB_TOKEN: ${{ secrets.GH_SCOUT_TOKEN || github.token }}   # machine-account token once set; Actions token until then
        run: python project_scout.py
      - name: Commit de-dupe state
        run: |
          git config user.name "project-scout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json index.json vet_cache.json scan_cache.json
          git diff --cached --quiet || (git commit -m "chore: update seen/index/vet/scan caches [skip ci]" && git pull --rebase && git push)
      - name: Alert on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" \
            -d text="❌ Project Scout digest FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
