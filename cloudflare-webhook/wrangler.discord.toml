name = "project-scout-discord"
main = "discord.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Deploy:  npx wrangler deploy -c wrangler.discord.toml
# Secrets (all REQUIRED — a missing one makes the endpoint refuse every command):
#   npx wrangler secret put DISCORD_PUBLIC_KEY -c wrangler.discord.toml   General Information → Public Key
#   npx wrangler secret put DISCORD_APP_ID     -c wrangler.discord.toml   General Information → Application ID
#   npx wrangler secret put DISCORD_GUILD_ID   -c wrangler.discord.toml   the TLDP server id (commands from any other server are rejected)
#   npx wrangler secret put STUDENT_ROLE_ID    -c wrangler.discord.toml   TLDP Student role id
#   npx wrangler secret put STAFF_ROLE_ID      -c wrangler.discord.toml   TLDP Staff role id
# No GitHub token, no bot token, no roster: this Worker only renders published.json and never assigns roles.
