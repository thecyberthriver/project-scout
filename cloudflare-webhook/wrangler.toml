name = "project-scout-bot"
main = "worker.js"
compatibility_date = "2024-11-01"
workers_dev = true

# Secrets (never committed), set with `npx wrangler secret put <NAME>`:
#   TELEGRAM_BOT_TOKEN   this bot's token from BotFather
#   WEBHOOK_SECRET       random string; must match setWebhook secret_token (REQUIRED — without it every update is refused)
#   OWNER_CHAT_ID        one chat id to lock the bot to; remove to open it up
# No GitHub token: the Worker only renders published.json (pre-screened snapshot) and makes no live searches.
